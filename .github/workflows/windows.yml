name: Windows
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PeerFerry.sln
      - run: dotnet build PeerFerry.sln -c Release --no-restore
      - run: ./scripts/test-apphost.ps1 -Executable src/PeerFerry.App/bin/Release/net10.0-windows/PeerFerry.exe
      - run: dotnet test tests/PeerFerry.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - run: ./scripts/test-ui.ps1 -NoBuild
      - run: ./scripts/test-installer.ps1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: tests/PeerFerry.Tests/TestResults
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-screenshots
          path: .work/ui-test-*/screenshots/*
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installer-checks
          path: |
            .work/installer-test-*/installer.png
            .work/installer-test-*/result.txt
            .work/installer-test-*/update-result.json
  package:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: ./scripts/build.ps1 -SkipTests
      - uses: actions/upload-artifact@v7
        with:
          name: PeerFerry-windows-x64
          path: dist/releases/*
