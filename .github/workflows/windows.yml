name: Windows
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PeerFerry.sln
      - run: dotnet build PeerFerry.sln -c Release --no-restore
      - run: dotnet test tests/PeerFerry.Tests -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/PeerFerry.Tests/TestResults
  package:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: ./scripts/build.ps1 -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: PeerFerry-windows-x64
          path: dist/releases/*
